<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AutoChat 控制台</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --panel-2: #eef0f4; --text: #1c1f24; --muted: #6b7280;
    --border: #dfe3e9; --accent: #2f6fed; --ok: #16a34a; --warn: #d97706; --bad: #dc2626;
    --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.10);
  }
  :root[data-theme="dark"] {
    --bg: #14161a; --panel: #1c1f26; --panel-2: #23272f; --text: #e8eaee; --muted: #97a0ad;
    --border: #2e333c; --accent: #5b8dff; --ok: #4ade80; --warn: #fbbf24; --bad: #f87171;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 1px 3px rgba(0,0,0,.5);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161a; --panel: #1c1f26; --panel-2: #23272f; --text: #e8eaee; --muted: #97a0ad;
      --border: #2e333c; --accent: #5b8dff; --ok: #4ade80; --warn: #fbbf24; --bad: #f87171;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 1px 3px rgba(0,0,0,.5);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 20px;
    background: var(--panel); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  .pill { font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--panel-2);
    color: var(--muted); border: 1px solid var(--border); }
  .pill.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
  .pill.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
  .spacer { flex: 1; }
  button { font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 5px 12px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  .layout { display: grid; grid-template-columns: 176px 1fr; min-height: calc(100vh - 53px); }
  nav { border-right: 1px solid var(--border); padding: 12px 8px; background: var(--panel); }
  nav a { display: block; padding: 8px 12px; border-radius: 8px; color: var(--muted);
    text-decoration: none; cursor: pointer; margin-bottom: 2px; }
  nav a:hover { background: var(--panel-2); color: var(--text); }
  nav a.active { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); font-weight: 600; }
  main { padding: 20px; overflow: auto; }
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; box-shadow: var(--shadow); }
  .card h3 { margin: 0 0 8px; font-size: 12px; color: var(--muted); font-weight: 600;
    text-transform: uppercase; letter-spacing: .6px; }
  .metric { font-size: 24px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .metric small { font-size: 13px; font-weight: 400; color: var(--muted); margin-left: 4px; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; font-variant-numeric: tabular-nums; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  tbody tr:hover { background: var(--panel-2); }
  code, pre { font-family: ui-monospace, Consolas, "Cascadia Mono", monospace; font-size: 12.5px; }
  pre { background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px; overflow: auto; max-height: 60vh; margin: 0; }
  .section { margin-bottom: 18px; }
  .section > h2 { font-size: 14px; margin: 0 0 10px; }
  .muted { color: var(--muted); }
  .empty { color: var(--muted); padding: 18px; text-align: center; }
  .error { color: var(--bad); padding: 18px; text-align: center; }
  .bar { height: 8px; border-radius: 999px; background: var(--panel-2); overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--accent); }
  .seg { display: inline-flex; gap: 4px; }
  .seg button { padding: 3px 10px; font-size: 12px; }
  .seg button.on { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; }
  svg.chart { width: 100%; height: auto; display: block; }
  tbody tr.click { cursor: pointer; }
  tbody tr.sel { background: color-mix(in srgb, var(--accent) 16%, transparent); }
  textarea { width: 100%; min-height: 230px; resize: vertical; box-sizing: border-box;
    font-family: ui-monospace, Consolas, "Cascadia Mono", monospace; font-size: 12.5px; line-height: 1.65;
    color: var(--text); background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px; }
  input[type=text] { font: inherit; color: var(--text); background: var(--panel-2);
    border: 1px solid var(--border); border-radius: 8px; padding: 5px 10px; min-width: 220px; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
  .warn-text { color: var(--warn); }
  .ok-text { color: var(--ok); }
  .bad-text { color: var(--bad); }
  .banner { border-radius: 10px; padding: 9px 12px; font-size: 12.5px; margin-bottom: 12px; border: 1px solid var(--border); }
  .banner.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
  .banner.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
  .banner.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
</style>
</head>
<body>
<header>
  <h1>AutoChat 控制台</h1>
  <span class="pill" id="conn">连接中…</span>
  <span class="pill" id="stamp"></span>
  <span class="spacer"></span>
  <button id="theme" title="切换主题">主题</button>
  <button id="refresh">刷新</button>
</header>
<div class="layout">
  <nav>
    <a data-page="overview" class="active">运行总览</a>
    <a data-page="sessions">会话</a>
    <a data-page="cost">花费与令牌</a>
    <a data-page="personas">人格</a>
    <a data-page="social">仿真</a>
    <a data-page="groups">群设置</a>
    <a data-page="slang">黑话</a>
    <a data-page="logs">日志</a>
    <a data-page="config">配置</a>
  </nav>
  <main id="main"><div class="empty">加载中…</div></main>
</div>
<script src="pages.js"></script>
<script src="pages-extra.js"></script>
<script src="app.js"></script>
</body>
</html>
