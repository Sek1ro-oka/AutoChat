<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>AutoChat 控制台</title>
<link rel="stylesheet" href="/console.css">
</head>
<body>
<header class="topbar">
  <div class="brandrow">
    <div class="brand">
      <svg class="whale" viewBox="0 0 64 64" width="36" height="36" role="img" aria-label="AutoChat 标志">
        <path fill="#4D6BFE" d="M4 30C4 20 10 12 19 10c7-1.7 14-1 19 2 3-4 6-7 10-9 1-.6 2 .5 1.5 1.5-2 4-4 8-4 12 3 3 5 7 5 11 0 9-8 16-20 16S4 40 4 30Z"/>
        <path fill="#FFFFFF" d="M8 32c3-4 8-6 14-5 7 1 12 5 14 10 .6 1.6.2 3.2-1 4.2-4 3-9.5 3.4-14.5 1.2C14 39.4 10 36 8 32Z"/>
        <circle cx="42" cy="24" r="2" fill="#FFFFFF"/>
      </svg>
      <div>
        <div class="brandtext">AutoChat 控制台</div>
        <div class="brandsub">QQ 机器人 · 本机运行 · 令牌保护</div>
      </div>
    </div>
    <div class="instsw" id="instsw"></div>
    <div class="topmeta">
      <span class="chip" id="conn"><span class="dot dot-off"></span>OneBot 连接 <b>—</b></span>
      <span class="chip" id="modelchip">模型 <b>—</b></span>
      <span class="chip" id="spendchip">今日花费 <b>—</b></span>
      <span class="chip" id="stamp">生成时间 <b>—</b></span>
      <button class="btn btn-sm" id="theme" type="button" data-act="theme">深色</button>
      <button class="btn btn-sm" id="refresh" type="button" data-act="refresh">刷新</button>
    </div>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <nav class="sidenav" id="nav">
      <div class="navgroup">运营</div>
      <button class="nav-btn active" type="button" data-page="overview"><svg class="ico" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true" focusable="false"><rect x="3" y="3" width="6" height="6" rx="1.2"/><rect x="11" y="3" width="6" height="6" rx="1.2"/><rect x="3" y="11" width="6" height="6" rx="1.2"/><rect x="11" y="11" width="6" height="6" rx="1.2"/></svg>概览</button>
      <button class="nav-btn" type="button" data-page="model"><svg class="ico" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true" focusable="false"><circle cx="7" cy="7" r="3.2"/><path d="M9.4 9.4 16.5 16.5M13.6 13.6l1.8-1.8"/></svg>模型与 API Key</button>
      <button class="nav-btn" type="button" data-page="personas"><svg class="ico" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true" focusable="false"><circle cx="10" cy="6.5" r="3.2"/><path d="M4 17c0-3.3 2.7-6 6-6s6 2.7 6 6"/></svg>人格</button>
      <button class="nav-btn" type="button" data-page="groups"><svg class="ico" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true" focusable="false"><circle cx="7" cy="7" r="2.8"/><circle cx="14" cy="7.6" r="2.2"/><path d="M2.6 16.4c0-2.4 2-4.4 4.4-4.4s4.4 2 4.4 4.4M12.2 12.3c2.2-.4 4.2 1.2 4.2 3.4"/></svg>群管理</button>
      <button class="nav-btn" type="button" data-page="activity"><svg class="ico" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M2 11h4l2-6 3 10 2.4-5H18"/></svg>活跃度与静默</button>
      <button class="nav-btn" type="button" data-page="qzone"><svg class="ico" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3.4 5.4c0-.9.7-1.6 1.6-1.6h10c.9 0 1.6.7 1.6 1.6v6.4c0 .9-.7 1.6-1.6 1.6H8.6L5 16.2v-2.8H5c-.9 0-1.6-.7-1.6-1.6V5.4Z"/><path d="M6.8 7.4h6.4M6.8 10h4"/></svg>空间说说</button>
      <div class="navgroup">数据</div>
      <button class="nav-btn" type="button" data-page="assets"><svg class="ico" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="4" width="14" height="12" rx="2"/><circle cx="7.4" cy="8.4" r="1.4"/><path d="M3.4 14.6 8 10l3 3 2.2-2.2 3.4 3.4"/></svg>素材库</button>
      <button class="nav-btn" type="button" data-page="cost"><svg class="ico" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M3 17V9M8 17V4M13 17v-7M17.5 17V7"/></svg>计费看板</button>
      <button class="nav-btn" type="button" data-page="logs"><svg class="ico" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M3.5 5.5h13M3.5 10h13M3.5 14.5h8"/></svg>日志与健康</button>
      <div class="navgroup">系统</div>
      <button class="nav-btn" type="button" data-page="settings"><svg class="ico" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true" focusable="false"><circle cx="10" cy="10" r="2.6"/><path d="M10 2.6v2.2M10 15.2v2.2M2.6 10h2.2M15.2 10h2.2M5.2 5.2l1.6 1.6M13.2 13.2l1.6 1.6M14.8 5.2l-1.6 1.6M6.8 13.2l-1.6 1.6"/></svg>系统设置</button>
      <div class="nav-tip">页面每 3 秒自动刷新；要保存的表单所在页不轮询，免得打断输入。带 <code>?</code> 的说明在每张卡片的副标题里。</div>
    </nav>
  </aside>
  <main class="main" id="main"></main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<noscript><p class="muted">这个控制台需要启用 JavaScript。</p></noscript>

<script src="/core.js"></script>
<script src="/pages-overview.js"></script>
<script src="/pages-model.js"></script>
<script src="/pages-personas.js"></script>
<script src="/pages-groups.js"></script>
<script src="/pages-activity.js"></script>
<script src="/pages-qzone.js"></script>
<script src="/pages-assets.js"></script>
<script src="/assets-stickers.js"></script>
<script src="/assets-slang.js"></script>
<script src="/pages-cost.js"></script>
<script src="/pages-logs.js"></script>
<script src="/pages-settings-reset.js"></script>
<script src="/pages-settings.js"></script>
<script src="/app.js"></script>
</body>
</html>
